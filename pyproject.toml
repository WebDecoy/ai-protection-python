[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "webdecoy-ai-protection"
version = "0.1.0a1"
description = "Async request admission for Python AI endpoints using WebDecoy"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["httpx>=0.28,<0.29"]

[project.urls]
Homepage = "https://webdecoy.com"
Repository = "https://github.com/WebDecoy/ai-protection-python"
Documentation = "https://github.com/WebDecoy/ai-protection-python#readme"
Issues = "https://github.com/WebDecoy/ai-protection-python/issues"

[project.optional-dependencies]
fastapi = ["fastapi>=0.115,<1"]
dev = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "build>=1.2,<2", "ruff>=0.11,<1", "ollama==0.6.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/webdecoy_ai_protection"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100
